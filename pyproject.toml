[project]
name = "alnahrian-erp-backend"
version = "1.0.0"
description = "Production Django 5.2 LTS + DRF ERP backend for Project-2 (Al-Nahrain Wholesale Foods)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.19",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt==5.5.1",
    "django-filter==26.2",
    "django-cors-headers==4.9.0",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.8",
    "argon2-cffi==25.1.0",
    "Pillow==13.0.0",
    "pydantic==2.14.3",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "python-dotenv==1.2.4",
    "celery==5.7.0",
    "redis==8.1.0",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "daphne==4.2.3",
    "pywebpush==2.5.0",
    "gunicorn==27.0.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1.post1",
    "factory-boy==3.3.3",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
testpaths = ["tests", "apps"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*WindowsSelectorEventLoopPolicy.*:DeprecationWarning:daphne",
    "ignore:.*set_event_loop_policy.*:DeprecationWarning:daphne",
]
markers = [
    "postgres: tests specifically exercising PostgreSQL locking and constraints",
]

[tool.ruff]
target-version = "py314"
line-length = 110
extend-exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
