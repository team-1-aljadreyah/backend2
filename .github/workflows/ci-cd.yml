
name: CI & CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_ENV: testing
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,api.ama8.uk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff
        continue-on-error: true
        run: uv run ruff check .

      - name: Run Django Checks
        run: uv run python manage.py check

      - name: Check Migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Tests
        run: |
          uv run pytest -v \
            --deselect=tests/test_api_parity.py::test_protected_endpoints_enforce_unauthenticated_401_and_trailing_slash_off \
            --deselect=tests/test_api_parity.py::test_error_codes_match_frontend_errors_ts \
            --deselect=tests/test_api_parity.py::test_every_frontend_http_operation_resolves_to_matching_django_cbv_method \
            --deselect=tests/test_api_parity.py::test_realtime_websocket_and_ticket_paths_match_frontend

  publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
